<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vertex Admin — Building Pravara 2026</title>
  <meta name="description" content="Admin Operations Portal for Vertex — Building Pravara 2026">
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- iOS-Style Transparent Navigation Bar for Admin Portal -->
  <header class="app-header ios-navbar" id="app-header">
    <div class="header-left">
      <a href="index.html" class="brand-logo-only" id="brand-logo-link" title="Vertex — Building Pravara 2026">
        <div class="brand-logo">V</div>
        <span class="status-dot online header-live-dot" id="ws-status-dot" title="Live Sync Active"></span>
      </a>
    </div>

    <div class="header-center" id="admin-header-center">
      <!-- Injected by JS -->
    </div>

    <div class="header-right" id="admin-header-right">
      <!-- Injected by JS -->
    </div>
  </header>

  <!-- Main Content -->
  <main class="admin-main" id="admin-main">
    <div style="display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:16px;">
      <div class="spinner"></div>
      <p style="color:var(--text-secondary);">Initializing Admin Portal…</p>
    </div>
  </main>

  <!-- Toast -->
  <div id="toast-container"></div>

  <!-- Lucide Modern Icon Engine -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Admin App Script -->
  <script type="module" src="js/admin-app.js"></script>
</body>
</html>
