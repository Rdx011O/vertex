<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertex — Building Pravara 2026 | Event Operations</title>
  <meta name="description" content="Unified event portal for Admin, Stall Coordinators and Members — Building Pravara 2026, Pravara Rural Engineering College, Loni.">

  <!-- Google Fonts: Inter, Outfit, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/pos.css">
  <link rel="stylesheet" href="css/badge.css">
</head>
<body>

  <!-- Unified Modern App Header -->
  <header class="app-header">
    <div class="header-left">
      <a href="#" class="brand-badge">
        <div class="brand-logo">V</div>
        <div class="brand-info">
          <div class="brand-title">VERTEX <span class="badge-tag-bp">BP'26</span></div>
          <div class="event-tag">Building Pravara 2026 • PREC Loni</div>
        </div>
      </a>

      <!-- Real-time Synchronization Status Pill -->
      <div class="header-sync-pill" title="Real-time WebSocket & Event Synchronization Status">
        <span class="status-dot online" id="ws-status-dot"></span>
        <span id="ws-status-text">Live Sync</span>
      </div>
    </div>

    <!-- Hidden compatibility container -->
    <div id="role-switcher-container" style="display:none;"></div>

    <div class="header-right">
      <!-- Diagnostics: Simulate Dead Spot (Offline Mode) -->
      <label class="sim-offline-toggle" title="Simulate unreliable Wi-Fi / dead spot to test offline POS queue">
        <input type="checkbox" id="sim-offline-toggle" />
        <span>⚡ Dead Spot</span>
      </label>

      <!-- Theme Toggle -->
      <button class="header-btn header-btn-theme" id="theme-toggle-btn" title="Toggle Dark / Light Theme">
        🌓
      </button>

      <!-- User Profile & Navigation Actions -->
      <div id="header-user-info" class="header-user-actions">
        <!-- Injected via app.js renderHeader() -->
      </div>
    </div>
  </header>

  <!-- Offline Warning Banner (Shown only when offline is simulated/active) -->
  <div class="offline-banner" id="offline-notice-banner" style="display: none; margin: 12px 16px 0 16px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span>📡</span>
      <span><strong>Offline Mode Active:</strong> Event Wi-Fi disconnected. POS transactions are being saved in your secure local queue and will auto-sync upon reconnection.</span>
    </div>
  </div>

  <!-- Main Dynamic Application Content -->
  <main class="main-content" id="app-main">
    <div style="text-align: center; padding: 60px 20px;">
      <h2>Initializing Vertex Real-time Operations Ledger...</h2>
    </div>
  </main>

  <!-- Modal / Badge QR Container -->
  <div id="qr-modal-container"></div>

  <!-- Toast Alert Toaster -->
  <div id="toast-container"></div>

  <!-- QR Scanner Engine (deferred so it never blocks page load) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>

  <!-- Core Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
