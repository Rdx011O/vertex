<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vertex — Building Pravara 2026 | Event Operations</title>
  <meta name="description" content="Unified event portal for Admin, Stall Coordinators and Members — Building Pravara 2026, Pravara Rural Engineering College, Loni.">

  <!-- Google Fonts: Inter, Outfit, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/pos.css">
  <link rel="stylesheet" href="css/badge.css">
</head>
<body>

  <!-- iOS-Style Transparent Navigation Bar -->
  <header class="app-header ios-navbar" id="app-header">
    <!-- 5. Left: ONLY the symbol of Vertex -->
    <div class="header-left">
      <a href="#" class="brand-logo-only" id="brand-logo-link" title="Vertex — Building Pravara 2026">
        <div class="brand-logo">V</div>
        <span class="status-dot online header-live-dot" id="ws-status-dot" title="Live Sync Active"></span>
      </a>
    </div>

    <!-- 2. Center: Role and Username -->
    <div class="header-center" id="header-center-info">
      <!-- Injected via renderHeader() in app.js -->
    </div>

    <!-- 3 & 4. Right: Notification toggle beside Theme toggle (plus Exit) -->
    <div class="header-right" id="header-right-actions">
      <!-- Injected via renderHeader() in app.js -->
    </div>
  </header>

  <!-- Offline Warning Banner (Shown only when offline is simulated/active) -->
  <div class="offline-banner" id="offline-notice-banner" style="display: none; margin: 12px 16px 0 16px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span><i data-lucide="wifi-off"></i></span>
      <span><strong>Offline Mode Active:</strong> Event Wi-Fi disconnected. POS transactions are being saved in your secure local queue and will auto-sync upon reconnection.</span>
    </div>
  </div>

  <!-- Main Application Layout Shell with Left Sidebar (Desktop/Tablet) and Bottom Bar (Mobile) -->
  <div class="app-layout-shell" id="app-layout-shell">
    <aside class="app-nav-sidebar" id="app-nav-sidebar" aria-label="Main Navigation">
      <div class="sidebar-header-action" id="sidebar-header-action">
        <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="Expand / Collapse Sidebar">
          <i data-lucide="panel-left-close" id="sidebar-toggle-icon"></i>
          <span class="sidebar-toggle-text">Collapse</span>
        </button>
      </div>

      <nav class="sidebar-nav-menu" id="sidebar-nav-menu"></nav>

      <div class="sidebar-footer-action" id="sidebar-footer-action">
        <button class="sidebar-nav-btn notif-drawer-trigger" id="sidebar-notif-btn" title="Activity & Notifications (Alerts & Audit Log)">
          <span class="nav-icon-wrap"><i data-lucide="history"></i></span>
          <span class="nav-text">Activity & Audit</span>
        </button>
      </div>
    </aside>

    <!-- Main Dynamic Application Content -->
    <main class="main-content" id="app-main">
      <div style="text-align: center; padding: 60px 20px;">
        <h2>Initializing Vertex Real-time Operations Ledger...</h2>
      </div>
    </main>
  </div>

  <!-- Modal / Badge QR Container -->
  <div id="qr-modal-container"></div>

  <!-- Toast Alert Toaster -->
  <div id="toast-container"></div>

  <!-- Lucide Modern Icon Engine -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- QR Scanner Engine (deferred so it never blocks page load) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>

  <!-- Core Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
